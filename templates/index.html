<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Remedio - Recordatorio</title>
    <!-- Enlaces para el Manifiesto y PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Fuente moderna desde Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .status-box {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            background: #f1f5f9;
            margin-top: 12px;
        }

        .status-box h3 {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .status-box .time-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Modal de Alarma Activa */
        #alarm-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            animation: pulse-modal 1s infinite alternate;
        }

        @keyframes pulse-modal {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .modal-content h2 {
            color: var(--danger);
            font-size: 1.75rem;
            margin-bottom: 10px;
        }

        .modal-content .med-name-alert {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            background: #eff6ff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
        }

        .modal-content p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mi Remedio</h1>
            <p>Control y recordatorio inteligente de medicamentos</p>
        </header>

        <!-- Tarjeta de Configuración -->
        <div class="card" id="setup-card">
            <div class="form-group">
                <label for="med-name">Nombre del Medicamento</label>
                <input type="text" id="med-name" class="form-control" placeholder="Ej. Doles / Losartán">
            </div>
            
            <div class="form-group">
                <label for="start-time">Hora de la primera toma</label>
                <input type="time" id="start-time" class="form-control">
            </div>

            <div class="form-group">
                <label for="interval-hours">Frecuencia (cada cuántas horas)</label>
                <input type="number" id="interval-hours" class="form-control" value="8" min="1" max="24">
            </div>

            <button class="btn btn-primary" onclick="startAlarmSystem()">Activar Recordatorio</button>
        </div>

        <!-- Tarjeta de Estado Activo -->
        <div class="card" id="status-card" style="display: none;">
            <div class="form-group">
                <h3 id="active-med-name" style="font-size: 1.1rem; color: var(--text-main); text-align: center; margin-bottom: 8px; font-weight: 600;">Medicamento: --</h3>
            </div>
            <div class="status-box">
                <h3>Próxima toma programada:</h3>
                <div class="time-display" id="next-dose-time">--:--</div>
            </div>
            <button class="btn btn-danger" style="margin-top: 16px;" onclick="cancelAlarm()">Cancelar / Cambiar Configuración</button>
        </div>
    </div>

    <!-- Modal de Alarma Activa -->
    <div id="alarm-modal">
        <div class="modal-content">
            <h2>¡Hora de tu medicina!</h2>
            <div class="med-name-alert" id="modal-med-name">Nombre del Remedio</div>
            <p>Es momento de tomar tu dosis programada.</p>
            <button class="btn btn-primary" onclick="acknowledgeAlarm()">Ya me la tomé (Detener)</button>
        </div>
    </div>

    <script>
        let alarmTimer = null;
        let audioContext = null;
        let beepInterval = null;

        // Cargar estado guardado al abrir la aplicación
        window.onload = function() {
            const savedState = localStorage.getItem('medState');
            if (savedState) {
                const state = JSON.parse(savedState);
                document.getElementById('setup-card').style.display = 'none';
                document.getElementById('status-card').style.display = 'block';
                document.getElementById('next-dose-time').innerText = state.nextDoseTimeStr;
                document.getElementById('active-med-name').innerText = "Medicamento: " + state.medName;
                checkAlarmLoop(state);
            }
        };

        function startAlarmSystem() {
            const medName = document.getElementById('med-name').value.trim() || 'Medicamento';
            const startTimeStr = document.getElementById('start-time').value;
            const intervalHours = parseFloat(document.getElementById('interval-hours').value);

            if (!startTimeStr) {
                alert('Por favor selecciona una hora de inicio.');
                return;
            }

            // Desbloquear audio para móviles al hacer clic
            initAudioContext();

            const now = new Date();
            const [hours, minutes] = startTimeStr.split(':');
            let nextDose = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);

            // Si la hora elegida ya pasó hoy, programarla para el siguiente ciclo
            if (nextDose <= now) {
                nextDose.setHours(nextDose.getHours() + intervalHours);
            }

            const state = {
                medName: medName,
                nextDoseTimestamp: nextDose.getTime(),
                nextDoseTimeStr: nextDose.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                intervalHours: intervalHours
            };

            localStorage.setItem('medState', JSON.stringify(state));

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('status-card').style.display = 'block';
            document.getElementById('next-dose-time').innerText = state.nextDoseTimeStr;
            document.getElementById('active-med-name').innerText = "Medicamento: " + medName;

            checkAlarmLoop(state);
            alert('¡Recordatorio activado con éxito!');
        }

        function initAudioContext() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log("Audio Context no soportado");
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function checkAlarmLoop(state) {
            if (alarmTimer) clearInterval(alarmTimer);

            alarmTimer = setInterval(() => {
                const now = new Date().getTime();
                if (now >= state.nextDoseTimestamp) {
                    triggerAlarmSound();
                    document.getElementById('modal-med-name').innerText = state.medName;
                    document.getElementById('alarm-modal').style.display = 'flex';
                }
            }, 1000);
        }

        // Generador de sonido de alarma original (Pitidos insistentes tipo Beep)
        function triggerAlarmSound() {
            if (beepInterval) return;
            initAudioContext();

            beepInterval = setInterval(() => {
                if (!audioContext) return;
                try {
                    let osc = audioContext.createOscillator();
                    let gain = audioContext.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 850;
                    gain.gain.setValueAtTime(0.7, audioContext.currentTime);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.35);
                } catch(err) {
                    console.log(err);
                }
            }, 800);
        }

        // Al presionar "Ya me la tomé", se detiene el sonido y se programa automáticamente la próxima hora exacta
        function acknowledgeAlarm() {
            if (beepInterval) {
                clearInterval(beepInterval);
                beepInterval = null;
            }
            document.getElementById('alarm-modal').style.display = 'none';

            const savedState = JSON.parse(localStorage.getItem('medState'));
            if (savedState) {
                // Sumar las horas del intervalo configurado a la última hora para la siguiente toma
                let nextDose = new Date(savedState.nextDoseTimestamp + (savedState.intervalHours * 3600 * 1000));
                
                savedState.nextDoseTimestamp = nextDose.getTime();
                savedState.nextDoseTimeStr = nextDose.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                localStorage.setItem('medState', JSON.stringify(savedState));
                document.getElementById('next-dose-time').innerText = savedState.nextDoseTimeStr;
                
                // Seguir vigilando para el siguiente ciclo
                checkAlarmLoop(savedState);
            }
        }

        function cancelAlarm() {
            if (beepInterval) {
                clearInterval(beepInterval);
                beepInterval = null;
            }
            if (alarmTimer) clearInterval(alarmTimer);
            localStorage.removeItem('medState');
            document.getElementById('alarm-modal').style.display = 'none';
            document.getElementById('status-card').style.display = 'none';
            document.getElementById('setup-card').style.display = 'block';
        }
    </script>
</body>
</html>
